<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 340px; padding: 10px; }
    label { display:block; margin: 6px 0 2px; }
    input { width: 100%; box-sizing: border-box; }
    button { margin-top: 6px; padding: 4px 8px; cursor: pointer; }
    .muted { color:#888; }
    #log { margin-top:10px; border-top:1px solid #ddd; padding-top:6px; }
    #logList { max-height:180px; overflow:auto; font: 11px/1.35 monospace; background:#111; color:#ddd;
               padding:6px; border-radius:6px; white-space:pre-wrap; }
    .lv-info { color:#7fd6ff; }
    .lv-warn { color:#ffd479; }
    .lv-error { color:#ff7b7b; }
    .lv-debug { color:#9a9; }
    #raw { margin-top:10px; border-top:1px solid #ddd; padding-top:6px; }
    #rawList { max-height:160px; overflow:auto; font: 11px/1.35 monospace; background:#141; color:#cfc;
               padding:6px; border-radius:6px; white-space:pre-wrap; margin-top:4px; }
    #rawList .rawItem { border-bottom:1px dashed #353; padding:4px 0; }
    #rawList .rawCmd { color:#9f9; }
    #manualOut { display:none; }
  </style>
</head>
<body>
  <label for="serverUrl">Servidor</label>
  <input id="serverUrl" placeholder="http://127.0.0.1:8765" />
  <label for="token">Token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="change-me-local-token" />
  <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
    <input id="showToken" type="checkbox" style="width:auto" />
    <label for="showToken" style="margin:0">mostrar token</label>
  </div>
  <button id="save">Salvar</button>
  <button id="approveAll">Aprovar tudo por 30 min</button>
  <button id="health">Testar servidor</button>
  <div id="status" class="muted"></div>

  <div id="manual" style="margin-top:10px;border-top:1px solid #ddd;padding-top:6px">
    <label for="manualCmd">Comando manual (roda direto no servidor, ignora o parser)</label>
    <textarea id="manualCmd" rows="3" spellcheck="false"
      placeholder="cat /tmp/c.txt"
      style="width:100%;box-sizing:border-box;font:11px/1.35 monospace"></textarea>
    <div style="display:flex;gap:6px;margin-top:4px">
      <button id="runManual" style="margin:0">Executar</button>
      <button id="useLastRaw" style="margin:0">Usar último raw do bloco</button>
    </div>
    <div id="manualOut" class="muted" style="font:11px/1.35 monospace;white-space:pre-wrap;
      background:#111;color:#ddd;border-radius:6px;padding:6px;margin-top:6px;max-height:140px;overflow:auto;display:none"></div>
  </div>

  <div id="raw">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Raw dos blocos (inner do md-code-block)</strong>
      <button id="clearRaw" style="margin:0">Limpar</button>
    </div>
    <div id="rawList"></div>
  </div>

  <div id="log">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Log</strong>
      <button id="clear" style="margin:0">Limpar</button>
    </div>
    <div id="logList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
